name: M9 Free Crop CPU Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-m9-crop.txt

      - uses: denoland/setup-deno@v2
        with:
          deno-version: "v2.x"

      - name: Install pinned CPU dependencies
        run: python -m pip install -r scripts/requirements-m9-crop.txt

      - name: Install MediaPipe Linux runtime library
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libegl1 libgles2

      - name: Load checksum-pinned Pretendard fonts for renderer integration tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m9-test-fonts"
          curl --fail --show-error --silent --location --retry 2 --max-time 90 \
            "https://raw.githubusercontent.com/orioncactus/pretendard/v1.3.9/packages/pretendard/dist/public/static/Pretendard-Bold.otf" \
            --output "$RUNNER_TEMP/m9-test-fonts/Pretendard-Bold.otf"
          echo "2e91915fab54df71cc9598ebf608b2bdb54c6fe3c066ac61dff0bc44fca71cc7  $RUNNER_TEMP/m9-test-fonts/Pretendard-Bold.otf" | sha256sum --check --status
          curl --fail --show-error --silent --location --retry 2 --max-time 90 \
            "https://raw.githubusercontent.com/orioncactus/pretendard/v1.3.9/packages/pretendard/dist/public/static/Pretendard-SemiBold.otf" \
            --output "$RUNNER_TEMP/m9-test-fonts/Pretendard-SemiBold.otf"
          echo "c89bc43027dc7cde5726e96223376f8eec09302b2fc1f8147fd5b57cfc376118  $RUNNER_TEMP/m9-test-fonts/Pretendard-SemiBold.otf" | sha256sum --check --status
          {
            echo "M9_TEST_FONT=$RUNNER_TEMP/m9-test-fonts/Pretendard-Bold.otf"
            echo "M9_TEST_BODY_FONT=$RUNNER_TEMP/m9-test-fonts/Pretendard-SemiBold.otf"
          } >> "$GITHUB_ENV"

      - name: Verify MediaPipe Linux runtime linkage
        run: |
          library="$(python -c 'from importlib.resources import files; print(files("mediapipe.tasks.c") / "libmediapipe.so")')"
          ldd "$library" | tee "$RUNNER_TEMP/mediapipe-linkage.txt"
          if grep -q "not found" "$RUNNER_TEMP/mediapipe-linkage.txt"; then
            exit 1
          fi

      - name: Verify model and run generated-image CPU smoke
        run: >-
          python scripts/m9_crop_cpu_smoke.py
          --model-path "$RUNNER_TEMP/m9-crop-model/blaze_face_short_range.tflite"
          --report "$RUNNER_TEMP/m9-crop-smoke.json"

      - name: Run M9 Python regressions
        run: python -m unittest discover -s scripts/tests -p 'test_m9_*.py' -v

      - name: Run M9 Deno regressions
        run: deno test -A supabase/functions/tests/m9

      - name: Write aggregate job summary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "m9-crop-smoke.json").read_text())
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as out:
              out.write("## M9 CPU crop validation\n\n")
              out.write(f"- Status: **{report['output_status']}**\n")
              out.write(f"- Model SHA-256: `{report['model_sha256']}`\n")
              out.write(f"- Runtime: Python {report['runtime_versions']['python']}; MediaPipe {report['runtime_versions']['mediapipe']}; Deno 2\n")
              out.write(f"- Model load / inference: {report['model_load_ms']} / {report['inference_ms']} ms\n")
              out.write(f"- Images / candidates / max per slot / detections: {report['image_count']} / {report['candidate_count']} / {report['max_candidates_per_slot']} / {report['face_count']}\n")
              out.write(f"- Total elapsed: {report['total_elapsed_seconds']} s\n")
          PY
