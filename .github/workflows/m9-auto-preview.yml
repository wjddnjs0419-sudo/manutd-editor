name: "M9 automatic Telegram card-news preview"

# Hourly polling: user does NOT need to provide a creative_brief_id.
# Instagram publication remains manual. Private owner preview only.
on:
  schedule:
    - cron: "22 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m9-automatic-preview
  cancel-in-progress: false

jobs:
  generate-private-previews:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.M9_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.M9_SUPABASE_SERVICE_ROLE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.M9_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_OWNER_USER_ID: ${{ secrets.M9_TELEGRAM_OWNER_USER_ID }}
      M9_ENABLE_TELEGRAM_PREVIEW: "YES"
      # Explicit trusted CDN allowlist (not derived from page HTML).
      M9_APPROVED_IMAGE_HOSTS: "i.guim.co.uk,ichef.bbci.co.uk"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "v2.x"
      - name: "Validate required repository secrets"
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SUPABASE_URL" && -n "$SUPABASE_SERVICE_ROLE_KEY" ]] || {
            echo "M9 Supabase Secrets missing"; exit 1;
          }
          [[ -n "$TELEGRAM_BOT_TOKEN" && "$TELEGRAM_OWNER_USER_ID" =~ ^[0-9]+$ ]] || {
            echo "M9 owner Telegram Secrets missing"; exit 1;
          }
      - name: "Install renderer dependency"
        run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
      - name: "Fetch pinned Pretendard Bold only for this run"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m9"
          curl --fail --show-error --silent --location --retry 2 --max-time 90 \
            "https://raw.githubusercontent.com/orioncactus/pretendard/v1.3.9/packages/pretendard/dist/public/static/Pretendard-Bold.otf" \
            --output "$RUNNER_TEMP/m9/Pretendard-Bold.otf"
          echo "2e91915fab54df71cc9598ebf608b2bdb54c6fe3c066ac61dff0bc44fca71cc7  $RUNNER_TEMP/m9/Pretendard-Bold.otf" | sha256sum --check --status
      - name: "Fetch approved fixed CTA from private Storage"
        shell: bash
        run: |
          python scripts/m9_fetch_fixed_cta.py --out "$RUNNER_TEMP/m9/cta.png"
      - name: "Automatically render and send recent READY briefs"
        shell: bash
        run: |
          python scripts/m9_auto_preview.py \
            --workdir "$RUNNER_TEMP/m9/auto-jobs" \
            --font "$RUNNER_TEMP/m9/Pretendard-Bold.otf" \
            --logo "assets/manutd_editor_logo.png" \
            --cta "$RUNNER_TEMP/m9/cta.png" \
            --max-sends 2 --hours-back 24
